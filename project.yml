name: Exochronometer
options:
  bundleIdPrefix: com.alchemicav
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  ExochronometerCore:
    type: framework
    platform: iOS
    sources:
      - ExochronometerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alchemicav.exochronometer.Core
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES

  Exochronometer:
    type: application
    platform: iOS
    sources:
      - Exochronometer
    dependencies:
      - target: ExochronometerCore
        embed: true
      - target: ExochronometerWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alchemicav.exochronometer
        INFOPLIST_FILE: Exochronometer/Info.plist
        CODE_SIGN_ENTITLEMENTS: Exochronometer/Exochronometer.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO

  ExochronometerWidget:
    type: app-extension
    platform: iOS
    sources:
      - ExochronometerWidget
    dependencies:
      - target: ExochronometerCore
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alchemicav.exochronometer.Widget
        INFOPLIST_FILE: ExochronometerWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: ExochronometerWidget/ExochronometerWidget.entitlements
